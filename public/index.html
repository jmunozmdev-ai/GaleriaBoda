<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Evita que el usuario haga zoom por accidente, dándole sensación de "App nativa" -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galería del Evento</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            background-color: #1a1a1a;
            color: white;
            padding: 20px;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        h1 { margin-bottom: 5px; }
        p { color: #aaaaaa; margin-bottom: 50px; }
        .cam-button {
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(255, 71, 87, 0.4);
            cursor: pointer;
            display: inline-block;
            transition: transform 0.2s;
        }
        .cam-button:active { transform: scale(0.95); }
        /* Ocultamos el feo botón nativo del navegador */
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <!-- VISTA 1: ONBOARDING (Se oculta automáticamente si ya tienen nombre) -->
    <div id="loginView">
        <h1>¡Bienvenido al Evento!</h1>
        <p>¿Cómo te llamas o cuál es tu apodo?</p>
        <input type="text" id="usernameInput" placeholder="Ej: Tío Juan, Ana..." 
               style="padding: 15px; font-size: 18px; border-radius: 8px; border: none; width: 80%; max-width: 300px; margin-bottom: 20px; text-align: center;">
        <br>
        <button onclick="saveUser()" class="cam-button" style="background-color: #0be881;">Entrar a la Galería</button>
    </div>

    <!-- VISTA 2: APLICACIÓN Y CÁMARA (Oculta por defecto) -->
    <div id="appView" style="display: none;">
        <h1 id="greetingText">📸 Galería en Vivo</h1>
        <p>Sube tu mejor momento sin perder calidad</p>

        <!-- Contenedor de botones -->
        <div style="display: flex; flex-direction: column; gap: 15px; align-items: center;">
            <label class="cam-button" for="cameraInput">
                📷 Tomar Foto
            </label>
            <input type="file" id="cameraInput" accept="image/*" capture="environment">

            <!-- NUEVO BOTÓN: Sin el atributo 'capture' para que abra la galería -->
            <label class="cam-button" for="galleryInput" style="background-color: #38ada9; font-size: 20px; padding: 15px 30px;">
                📁 Subir de Galería
            </label>
            <input type="file" id="galleryInput" accept="image/*">
        </div>
        <h3 id="statusText" style="margin-top: 30px; transition: 0.3s;"></h3>

        <!-- Contenedor dinámico de la galería -->
        <div id="gallery" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-top: 40px; padding-bottom: 50px;">
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
